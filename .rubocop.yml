inherit_gem:
  sharp_style_rubocop: config/default.yml

# The E2E specs describe a bundle command, not a class
RSpec/DescribeClass:
  Exclude:
    - 'spec/e2e/**/*'

# The E2E gem repo fixture memoizes a temp directory and chdirs while building
# it. The suite runs single-threaded, so the process-wide state is harmless.
ThreadSafety/ClassInstanceVariable:
  Exclude:
    - 'spec/e2e/support/**/*'
ThreadSafety/DirChdir:
  Exclude:
    - 'spec/e2e/support/**/*'
